<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished Hello World page." />
    <title>Hello, World!</tigitle>
    <style>
      :root { color-scheme: dark; }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 1.5rem;
        color: #f6f7ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.23), transparent 28rem),
          radial-gradient(circle at 85% 78%, rgba(139, 92, 246, 0.27), transparent 32rem),
          #080a19;
      }

      main { width: min(100%, 46rem); text-align: center; }

      .card {
        padding: clamp(2.5rem, 7vw, 5.5rem);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 2rem;
        background: linear-gradient(145deg, rgba(31, 36, 75, 0.8), rgba(18, 22, 48, 0.68));
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.38), inset 0 1px rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        animation: enter 700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 1.35rem;
        padding: 0.5rem 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: #dce1ff;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.1rem, 10vw, 6.5rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
        background: linear-gradient(120deg, #fff, #b9c5ff 48%, #67e8f9 78%, #fff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 35rem;
        margin: 1.6rem auto 2.1rem;
        color: #b9bdd5;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.7;
      }

      button {
        padding: 0.9rem 1.2rem;
        border: 0;
        border-radius: 0.85rem;
        color: #090b1d;
        background: linear-gradient(135deg, #a5f3fc, #c4b5fd);
        box-shadow: 0 0.8rem 2rem rgba(34, 211, 238, 0.2);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      button:hover { transform: translateY(-3px); box-shadow: 0 1.1rem 2.4rem rgba(139, 92, 246, 0.35); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      @keyframes enter {
        from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
        to { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">✦ A fresh start</p>
        <h1 id="title">Hello, World!</h1>
        <p>Your beautifully crafted little corner of the web is up and running. Now make something remarkable.</p>
        <button type="button" onclick="this.textContent = '✨ You made it happen!'">Say hello →</button>
      </section>
    </main>
  </body>
</html>
